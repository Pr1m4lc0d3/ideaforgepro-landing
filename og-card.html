<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Archivo:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{margin:0}
  /* Sizes in vw/vh so the card fills the same proportion at any render scale.
     Palette + type sampled from the live landing (pitch/ember, Big Shoulders). */
  .card{
    position:fixed;inset:0;overflow:hidden;color:#E8F1F8;
    font-family:"Archivo",system-ui,sans-serif;
    background:
      radial-gradient(58vw 64vh at 84% 118%, rgba(247,148,35,.30), transparent 60%),
      radial-gradient(46vw 50vh at 94% -12%, rgba(255,210,63,.10), transparent 60%),
      linear-gradient(rgba(120,170,240,.045) 1px,transparent 1px) 0 0/3.4vw 3.4vw,
      linear-gradient(90deg,rgba(120,170,240,.045) 1px,transparent 1px) 0 0/3.4vw 3.4vw,
      #08090C;
    padding:5vh 5vw;
    display:grid;grid-template-rows:auto 1fr auto;
  }
  .brand{display:flex;align-items:center;gap:1.2vw}
  .brand img{height:5.4vh;width:auto;filter:drop-shadow(0 0 1.3vh rgba(247,148,35,.55))}
  .brand span{font-family:"Big Shoulders Display",Haettenschweiler,"Arial Narrow",sans-serif;
    font-weight:800;font-size:3.1vw;line-height:1;letter-spacing:.02em;text-transform:uppercase;color:#E8F1F8}
  .mid{align-self:center}
  .eyebrow{font-family:"Archivo",sans-serif;font-weight:600;font-size:1.7vw;letter-spacing:.24em;
    text-transform:uppercase;color:#F79423;margin-bottom:2.4vh}
  h1{font-family:"Big Shoulders Display",Haettenschweiler,"Arial Narrow",sans-serif;
    font-weight:800;font-size:9.2vw;line-height:.9;letter-spacing:-.01em;text-transform:uppercase}
  h1 em{font-style:normal;color:#F79423}
  .foot{align-self:end;font-family:"Archivo",sans-serif;font-weight:500;font-size:1.8vw;color:#8A97A8}
  .foot b{color:#E8F1F8;font-weight:600}
  .rule{position:absolute;left:0;right:0;bottom:0;height:1.1vh;background:linear-gradient(90deg,#F79423,#FFD23F 40%,#E8F1F8)}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="assets/mark.webp" alt=""><span>Idea Forge Pro</span></div>
    <div class="mid">
      <div class="eyebrow">Sell before you build</div>
      <h1>Stop building startups <em>nobody&nbsp;buys.</em></h1>
    </div>
    <div class="foot">Seven brutal gates · a ruthless AI · free · <b>ideaforgepro.com</b></div>
    <div class="rule"></div>
  </div>
</body>
</html>
